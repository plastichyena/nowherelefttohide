name: AI Portable Player Package v1.5.7

on:
  workflow_run:
    workflows: ["CI and GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-portable-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Linux x64 AI package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies for checkout validation
        run: npm ci

      - name: Validate checkout before assembling Player package
        run: |
          npm run typecheck
          npx --no-install vitest run --pool=threads --maxWorkers=2 --exclude src/agent/balancedAgent.batch.test.ts --exclude src/agent/balancedAgent.seed198.test.ts
          npm run build
          node scripts/build-portable.mjs --out=dist/portable/session-cli.mjs

      - name: Assemble minimal Linux Player package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          PACKAGE_NAME="nowhere-left-to-hide-ai-${VERSION}-${SHORT_SHA}-linux-x64"
          PACKAGE_ROOT="${RUNNER_TEMP}/${PACKAGE_NAME}"
          NODE_VERSION="$(node --version)"
          NODE_LICENSE="${RUNNER_TEMP}/node-${NODE_VERSION}-LICENSE.txt"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/nodejs/node/${NODE_VERSION}/LICENSE" --output "${NODE_LICENSE}"
          node scripts/assemble-portable.mjs \
            --source="${GITHUB_WORKSPACE}" \
            --out="${PACKAGE_ROOT}" \
            --platform=linux-x64 \
            --node="$(command -v node)" \
            --node-license="${NODE_LICENSE}" \
            --commit="${FULL_SHA}" \
            --build-id="${FULL_SHA}"
          echo "package_name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "package_root=${PACKAGE_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Verify minimal Linux Player package contents
        id: verify_package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          for FILE in \
            PLAY_WITH_AI.md LICENSE ADDITIONAL_PERMISSIONS.md THIRD_PARTY_NOTICES ASSETS_LICENSE.md \
            licenses/node-LICENSE.txt licenses/fflate-LICENSE.txt \
            BUILD_INFO.txt PORTABLE_PACKAGE.json runtime/identity.env \
            runtime/node/node run-session.sh session-cli.mjs; do
            test -f "${ROOT}/${FILE}"
          done
          test -x "${ROOT}/runtime/node/node"
          test -x "${ROOT}/run-session.sh"
          test ! -e "${ROOT}/node_modules"
          test ! -e "${ROOT}/package.json"
          test ! -e "${ROOT}/src"
          test ! -e "${ROOT}/public"
          test ! -e "${ROOT}/run-npm.sh"
          test ! -e "${ROOT}/run-vite-node.sh"
          "${ROOT}/run-session.sh" --help | grep -F '"play-turn"'
          VERSION="$(node -p "require('./package.json').version")"
          grep -F "App version: ${VERSION}" "${ROOT}/BUILD_INFO.txt"
          grep -F "Platform: linux-x64" "${ROOT}/BUILD_INFO.txt"

      - name: Smoke test checkout built-in Agent
        shell: bash
        run: |
          set -euo pipefail
          npm run sim -- --agent=random --games=1 --seed=1 --summary-only --out="${RUNNER_TEMP}/checkout-ai-smoke" --overwrite

      - name: Smoke test Linux Player package from checkout driver
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          REPORT="${RUNNER_TEMP}/${{ steps.package.outputs.package_name }}-smoke.json"
          SESSION_ROOT="${RUNNER_TEMP}/${{ steps.package.outputs.package_name }}-sessions"
          node scripts/portable-smoke.mjs --launcher="${ROOT}/run-session.sh" --root="${SESSION_ROOT}" --out="${REPORT}" --seeds=1,7
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (report.ok !== true || report.commands.length !== 9 || report.seeds.length !== 2 || report.replayMatched !== true) process.exit(1);
          ' "${REPORT}"
          echo "session_root=${SESSION_ROOT}" >> "${GITHUB_OUTPUT}"
          echo "smoke_report=${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Create distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          zip -q -r -y \
            "${GITHUB_WORKSPACE}/${{ steps.package.outputs.package_name }}.zip" \
            "${{ steps.package.outputs.package_name }}"

      - name: Record Linux package and Session evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          EVIDENCE="${RUNNER_TEMP}/${{ steps.package.outputs.package_name }}-evidence.json"
          node scripts/portable-size-evidence.mjs \
            --package="${ROOT}" \
            --zip="${GITHUB_WORKSPACE}/${{ steps.package.outputs.package_name }}.zip" \
            --session-root="${{ steps.smoke.outputs.session_root }}" \
            --launcher="${ROOT}/run-session.sh" \
            --session=portable-command-smoke \
            --out="${EVIDENCE}"
          echo "evidence=${EVIDENCE}" >> "${GITHUB_OUTPUT}"

      - name: Upload portable AI Player package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}-evidence
          path: |
            ${{ steps.smoke.outputs.smoke_report }}
            ${{ steps.evidence.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Build Windows x64 AI package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies for checkout validation
        run: npm ci

      - name: Validate checkout before assembling Windows Player package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows may expose os.tmpdir() through an 8.3 alias. Keep
          # Session's strict no-reparse checks and use a canonical test root.
          $testTemp = Join-Path $env:RUNNER_TEMP 'nlth-checkout-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $canonicalTemp = node -e "process.stdout.write(require('node:fs').realpathSync.native(process.argv[1]))" $testTemp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = $canonicalTemp
          $env:TMP = $canonicalTemp
          $env:TMPDIR = $canonicalTemp
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install vitest run --pool=threads --maxWorkers=2 --exclude src/agent/balancedAgent.batch.test.ts --exclude src/agent/balancedAgent.seed198.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-portable.mjs --out=dist/portable/session-cli.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble minimal Windows Player package
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $shortSha = git rev-parse --short=12 HEAD
          $fullSha = git rev-parse HEAD
          $packageName = "nowhere-left-to-hide-ai-$version-$shortSha-win-x64"
          $packageRoot = Join-Path $env:RUNNER_TEMP $packageName
          $nodePath = (Get-Command node).Source
          $nodeVersion = node --version
          $nodeLicense = Join-Path $env:RUNNER_TEMP "node-$nodeVersion-LICENSE.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" -OutFile $nodeLicense
          node scripts/assemble-portable.mjs `
            --source="$env:GITHUB_WORKSPACE" `
            --out="$packageRoot" `
            --platform=win-x64 `
            --node="$nodePath" `
            --node-license="$nodeLicense" `
            --commit="$fullSha" `
            --build-id="$fullSha"
          if ($LASTEXITCODE -ne 0) { throw "Portable package assembly failed with exit code $LASTEXITCODE" }
          "package_name=$packageName" | Add-Content $env:GITHUB_OUTPUT
          "package_root=$packageRoot" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify minimal Windows Player package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          @('PLAY_WITH_AI.md', 'LICENSE', 'ADDITIONAL_PERMISSIONS.md', 'THIRD_PARTY_NOTICES', 'ASSETS_LICENSE.md', 'licenses/node-LICENSE.txt', 'licenses/fflate-LICENSE.txt', 'BUILD_INFO.txt', 'PORTABLE_PACKAGE.json', 'runtime/identity.cmd', 'runtime/node/node.exe', 'run-session.cmd', 'session-cli.mjs') |
            ForEach-Object { if (-not (Test-Path (Join-Path $root $_))) { throw "Missing portable package entry: $_" } }
          if (Test-Path (Join-Path $root 'node_modules')) { throw 'Player package unexpectedly contains node_modules' }
          if (Test-Path (Join-Path $root 'package.json')) { throw 'Player package unexpectedly contains package.json' }
          if (Test-Path (Join-Path $root 'src')) { throw 'Player package unexpectedly contains TypeScript source' }
          if (Test-Path (Join-Path $root 'public')) { throw 'Player package unexpectedly contains UI assets' }
          if (Test-Path (Join-Path $root 'run-npm.cmd')) { throw 'Player package unexpectedly contains run-npm.cmd' }
          if (Test-Path (Join-Path $root 'run-vite-node.cmd')) { throw 'Player package unexpectedly contains run-vite-node.cmd' }
          $version = (Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'package.json') | ConvertFrom-Json).version
          if (-not (Select-String -Quiet -Path (Join-Path $root 'BUILD_INFO.txt') -Pattern "App version: $version")) { throw 'BUILD_INFO app version is missing' }
          if (-not (Select-String -Quiet -Path (Join-Path $root 'BUILD_INFO.txt') -Pattern 'Platform: win-x64')) { throw 'BUILD_INFO platform is missing' }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $root 'PORTABLE_PACKAGE.json') | ConvertFrom-Json
          if ($manifest.packageKind -ne 'player' -or $manifest.developmentFilesIncluded -ne $false) { throw 'Player package manifest is invalid' }

      - name: Smoke test checkout built-in Agent on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run sim -- --agent=random --games=1 --seed=1 --summary-only --out="$env:RUNNER_TEMP/checkout-ai-windows-smoke" --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test Windows Player package from checkout driver
        id: smoke_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          $report = Join-Path $env:RUNNER_TEMP '${{ steps.package_windows.outputs.package_name }}-smoke.json'
          $sessionRoot = Join-Path $env:RUNNER_TEMP '${{ steps.package_windows.outputs.package_name }}-sessions'
          node scripts/portable-smoke.mjs --launcher="$root/run-session.cmd" --root="$sessionRoot" --out="$report" --seeds=1,7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $smoke.ok -or $smoke.commands.Count -ne 9 -or $smoke.seeds.Count -ne 2 -or -not $smoke.replayMatched) { throw 'Windows Player smoke report is incomplete' }
          "session_root=$sessionRoot" | Add-Content $env:GITHUB_OUTPUT
          "smoke_report=$report" | Add-Content $env:GITHUB_OUTPUT

      - name: Create Windows distributable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          $zip = Join-Path $env:GITHUB_WORKSPACE '${{ steps.package_windows.outputs.package_name }}.zip'
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal

      - name: Record Windows package and Session evidence
        id: evidence_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          $zip = Join-Path $env:GITHUB_WORKSPACE '${{ steps.package_windows.outputs.package_name }}.zip'
          $evidence = Join-Path $env:RUNNER_TEMP '${{ steps.package_windows.outputs.package_name }}-evidence.json'
          node scripts/portable-size-evidence.mjs --package="$root" --zip="$zip" --session-root='${{ steps.smoke_windows.outputs.session_root }}' --launcher="$root/run-session.cmd" --session=portable-command-smoke --out="$evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "evidence=$evidence" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload Windows portable AI Player package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_windows.outputs.package_name }}
          path: ${{ steps.package_windows.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_windows.outputs.package_name }}-evidence
          path: |
            ${{ steps.smoke_windows.outputs.smoke_report }}
            ${{ steps.evidence_windows.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
