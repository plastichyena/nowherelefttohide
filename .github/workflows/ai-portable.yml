name: AI Portable Package v1.5.2

on:
  workflow_run:
    workflows: ["CI and GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-portable-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Linux x64 AI package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Assemble portable package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          NODE_VERSION="$(node --version)"
          PACKAGE_NAME="nowhere-left-to-hide-ai-${VERSION}-${SHORT_SHA}-linux-x64"
          PACKAGE_ROOT="${RUNNER_TEMP}/${PACKAGE_NAME}"

          mkdir -p "${PACKAGE_ROOT}/game" "${PACKAGE_ROOT}/runtime"

          # Copy the repository source, but replace generated/runtime-heavy
          # directories with the clean dependency tree installed above.
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='output/' \
            ./ "${PACKAGE_ROOT}/game/"
          cp -a node_modules "${PACKAGE_ROOT}/game/node_modules"

          # Bundle the Session CLI before distribution.  A player may invoke
          # one `step` per process, so run-session must never invoke Vite or
          # transform TypeScript on every action.
          (
            cd "${PACKAGE_ROOT}/game"
            node scripts/build-portable.mjs --out=dist/portable/session-cli.mjs
          )

          # actions/setup-node installs a self-contained Node distribution in
          # the runner tool cache. Copy that distribution so the downloaded
          # package does not require Node.js to be installed separately.
          NODE_ROOT="$(cd "$(dirname "$(command -v node)")/.." && pwd)"
          cp -a "${NODE_ROOT}" "${PACKAGE_ROOT}/runtime/node"

          cp PLAY_WITH_AI.md "${PACKAGE_ROOT}/PLAY_WITH_AI.md"

          cat > "${PACKAGE_ROOT}/BUILD_INFO.txt" <<EOF
          Nowhere Left to Hide portable AI package
          App version: ${VERSION}
          Commit: ${FULL_SHA}
          Build ID: ${FULL_SHA}
          Node.js: ${NODE_VERSION}
          Platform: linux-x64
          Generated by: GitHub Actions
          EOF

          cat > "${PACKAGE_ROOT}/runtime/identity.env" <<EOF
          export NLTH_GIT_COMMIT='${FULL_SHA}'
          export NLTH_BUILD_ID='${FULL_SHA}'
          EOF

          cat > "${PACKAGE_ROOT}/run-npm.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          source "${ROOT}/runtime/identity.env"
          export PATH="${ROOT}/runtime/node/bin:${PATH}"
          cd "${ROOT}/game"
          exec npm "$@"
          EOF

          cat > "${PACKAGE_ROOT}/run-vite-node.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          source "${ROOT}/runtime/identity.env"
          cd "${ROOT}"
          exec "${ROOT}/runtime/node/bin/node" \
            "${ROOT}/game/node_modules/vite-node/vite-node.mjs" \
            --script "$@"
          EOF

          cat > "${PACKAGE_ROOT}/run-session.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          source "${ROOT}/runtime/identity.env"
          cd "${ROOT}/game"
          exec "${ROOT}/runtime/node/bin/node" \
            "${ROOT}/game/dist/portable/session-cli.mjs" "$@"
          EOF

          chmod +x \
            "${PACKAGE_ROOT}/run-npm.sh" \
            "${PACKAGE_ROOT}/run-vite-node.sh" \
            "${PACKAGE_ROOT}/run-session.sh" \
            "${PACKAGE_ROOT}/runtime/node/bin/node"

          echo "package_name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "package_root=${PACKAGE_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Verify portable package contents
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          test -f "${ROOT}/PLAY_WITH_AI.md"
          test -f "${ROOT}/BUILD_INFO.txt"
          test -f "${ROOT}/runtime/identity.env"
          test -f "${ROOT}/game/package.json"
          test -f "${ROOT}/game/package-lock.json"
          test -d "${ROOT}/game/node_modules"
          test -f "${ROOT}/game/src/agent/game.ts"
          test -f "${ROOT}/game/src/session/session-cli.ts"
          test -f "${ROOT}/game/dist/portable/session-cli.mjs"
          test -f "${ROOT}/game/public/assets/board/ASSET_MANIFEST.md"
          test -f "${ROOT}/game/public/assets/board/units/unit_police.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_riot_police.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_horde_zombie.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_police_zombie.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_soldier_zombie.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_riot_zombie.png"
          test -f "${ROOT}/game/public/assets/board/units/unit_hunter_zombie.png"
          test -f "${ROOT}/game/public/assets/board/facilities/facility_wind_power_plant.png"
          test -f "${ROOT}/game/public/assets/board/facilities/facility_simple_farm.png"
           test -f "${ROOT}/game/public/assets/board/facilities/facility_civilian_drone_base.png"
           test -x "${ROOT}/runtime/node/bin/node"
           test -x "${ROOT}/run-session.sh"
          "${ROOT}/run-session.sh" --help | grep -F '"play-turn"'
           VERSION="$(node -p "require('${ROOT}/game/package.json').version")"
          test "${VERSION}" = "1.5.2"
          grep -F "App version: ${VERSION}" "${ROOT}/BUILD_INFO.txt"
          grep -F "Build ID:" "${ROOT}/BUILD_INFO.txt"
          grep -F "Platform: linux-x64" "${ROOT}/BUILD_INFO.txt"

      - name: Smoke test bundled Node runtime
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.package.outputs.package_root }}/run-npm.sh" run sim -- \
            --agent=random \
            --games=1 \
            --seed=1 \
            --summary-only \
            --out="${RUNNER_TEMP}/portable-ai-smoke" \
            --overwrite

      - name: Smoke test all Session CLI commands and compact query with bundled Node
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          SESSION_ROOT="${RUNNER_TEMP}/portable-session-smoke"
          SESSION_ID="portable-smoke"
          CHILD_SESSION_ID="portable-smoke-child"
          ARTIFACT_PATH="${SESSION_ROOT}/portable-smoke-child.nlth-artifact"

          NEW_JSON="$("${ROOT}/run-session.sh" new \
            --root="${SESSION_ROOT}" \
            --session-id="${SESSION_ID}" \
            --seed=1 \
            --checkpoint-interval=1 \
            --agent-id=portable-smoke)"
          STATUS_JSON="$("${ROOT}/run-session.sh" status --root="${SESSION_ROOT}" --session="${SESSION_ID}")"
          STEP_JSON="$(printf '%s\n' '{"action":{"type":"EndTurn"},"decisionSummary":"Portable package Session CLI smoke","expectedRevision":0}' | \
            "${ROOT}/run-session.sh" step --root="${SESSION_ROOT}" --session="${SESSION_ID}")"
          SAVE_JSON="$("${ROOT}/run-session.sh" save-checkpoint --root="${SESSION_ROOT}" --session="${SESSION_ID}")"
          LIST_JSON="$("${ROOT}/run-session.sh" list-checkpoints --root="${SESSION_ROOT}" --session="${SESSION_ID}")"
          CHECKPOINT_ID="$(printf '%s' "${SAVE_JSON}" | "${ROOT}/runtime/node/bin/node" -e \
            'let text=""; process.stdin.on("data", chunk => text += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(text).checkpoint.checkpointId));')"
          LOAD_JSON="$("${ROOT}/run-session.sh" load-checkpoint \
            --root="${SESSION_ROOT}" \
            --session="${SESSION_ID}" \
            --checkpoint="${CHECKPOINT_ID}" \
            --new-session-id="${CHILD_SESSION_ID}")"
          QUERY_JSON="$("${ROOT}/run-session.sh" query \
            --root="${SESSION_ROOT}" \
            --session="${CHILD_SESSION_ID}" \
            --target=full-snapshot \
            --page-size=100)"
          ARTIFACT_JSON="$("${ROOT}/run-session.sh" artifact \
            --root="${SESSION_ROOT}" \
            --session="${CHILD_SESSION_ID}" \
            --out="${ARTIFACT_PATH}")"

          printf '%s\n' "${NEW_JSON}" "${STATUS_JSON}" "${STEP_JSON}" "${SAVE_JSON}" "${LIST_JSON}" "${LOAD_JSON}" "${QUERY_JSON}" "${ARTIFACT_JSON}" | \
            "${ROOT}/runtime/node/bin/node" -e '
              let text = "";
              process.stdin.on("data", chunk => text += chunk);
              process.stdin.on("end", () => {
                const expected = ["new", "status", "step", "save-checkpoint", "list-checkpoints", "load-checkpoint", "query", "artifact"];
                const values = text.trim().split(/\n/u).map(line => JSON.parse(line));
                if (values.length !== expected.length || values.some((value, index) => value.ok !== true || value.command !== expected[index])) process.exit(1);
              });'
          test -f "${ARTIFACT_PATH}/manifest.json"
          test -s "${ARTIFACT_PATH}/artifact.ndjson"

      - name: Run external AI Seeds 1 and 7 to Game Over and replay with bundled Node
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          for SEED in 1 7; do
            REPORT="${ROOT}/EXTERNAL_AI_E2E_${SEED}.json"
            "${ROOT}/run-vite-node.sh" "${ROOT}/game/src/testing/external-ai-e2e.ts" \
              --seed="${SEED}" \
              --out="${REPORT}"
            test -s "${REPORT}"
            "${ROOT}/runtime/node/bin/node" -e '
              const report = require(process.argv[1]);
              const expectedSeed = Number(process.argv[2]);
              if (report.ok !== true || report.seed !== expectedSeed || report.gameOver !== true || report.replayMatched !== true) process.exit(1);
            ' "${REPORT}" "${SEED}"
          done

      - name: Complete persistent Sessions for Seeds 1 and 7 with the bundled CLI
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.package.outputs.package_root }}"
          "${ROOT}/run-vite-node.sh" "${ROOT}/game/src/testing/portable-session-e2e.ts" \
            --cli="${ROOT}/game/dist/portable/session-cli.mjs" \
            --root="${RUNNER_TEMP}/portable-session-completion" \
            --out="${ROOT}/PORTABLE_SESSION_E2E.json"
          "${ROOT}/runtime/node/bin/node" -e '
            const report = require(process.argv[1]);
            if (!report.ok || !report.replayMatched || report.seeds.length !== 2) process.exit(1);
          ' "${ROOT}/PORTABLE_SESSION_E2E.json"

      - name: Create distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          zip -q -r -y \
            "${GITHUB_WORKSPACE}/${{ steps.package.outputs.package_name }}.zip" \
            "${{ steps.package.outputs.package_name }}"

      - name: Upload portable AI package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-windows:
    name: Build Windows x64 AI package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Assemble Windows portable package
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $shortSha = git rev-parse --short=12 HEAD
          $fullSha = git rev-parse HEAD
          $packageName = "nowhere-left-to-hide-ai-$version-$shortSha-win-x64"
          $packageRoot = Join-Path $env:RUNNER_TEMP $packageName
          $gameRoot = Join-Path $packageRoot 'game'
          New-Item -ItemType Directory -Force -Path $gameRoot, (Join-Path $packageRoot 'runtime') | Out-Null

          robocopy $env:GITHUB_WORKSPACE $gameRoot /E /XD .git node_modules dist output | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit code $LASTEXITCODE" }
          Copy-Item -Recurse -Force node_modules (Join-Path $gameRoot 'node_modules')
          Push-Location $gameRoot
          try {
            node scripts/build-portable.mjs --out=dist/portable/session-cli.mjs
            if ($LASTEXITCODE -ne 0) { throw "Portable CLI build failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

          $nodeRoot = Split-Path -Parent (Get-Command node).Source
          Copy-Item -Recurse -Force $nodeRoot (Join-Path $packageRoot 'runtime/node')
          Set-Content -Encoding ascii (Join-Path $packageRoot 'runtime/identity.cmd') @(
            "set `"NLTH_GIT_COMMIT=$fullSha`"",
            "set `"NLTH_BUILD_ID=$fullSha`""
          )
          Set-Content -Encoding ascii (Join-Path $packageRoot 'run-npm.cmd') @(
            '@echo off', 'setlocal', 'set "ROOT=%~dp0"', 'call "%ROOT%runtime\identity.cmd"',
            'set "PATH=%ROOT%runtime\node;%PATH%"',
            'cd /d "%ROOT%game"', 'call "%ROOT%runtime\node\npm.cmd" %*', 'exit /b %ERRORLEVEL%'
          )
          Set-Content -Encoding ascii (Join-Path $packageRoot 'run-vite-node.cmd') @(
            '@echo off', 'setlocal', 'set "ROOT=%~dp0"', 'call "%ROOT%runtime\identity.cmd"',
            'cd /d "%ROOT%game"',
            '"%ROOT%runtime\node\node.exe" "%ROOT%game\node_modules\vite-node\vite-node.mjs" --script %*', 'exit /b %ERRORLEVEL%'
          )
          Set-Content -Encoding ascii (Join-Path $packageRoot 'run-session.cmd') @(
            '@echo off', 'setlocal', 'set "ROOT=%~dp0"', 'call "%ROOT%runtime\identity.cmd"',
            'cd /d "%ROOT%game"', '"%ROOT%runtime\node\node.exe" "%ROOT%game\dist\portable\session-cli.mjs" %*', 'exit /b %ERRORLEVEL%'
          )
          Set-Content -Encoding utf8 (Join-Path $packageRoot 'BUILD_INFO.txt') @(
            'Nowhere Left to Hide portable AI package', "App version: $version", "Commit: $fullSha", "Build ID: $fullSha",
            "Node.js: $(node --version)", 'Platform: win-x64', 'Generated by: GitHub Actions'
          )
          Copy-Item -Force PLAY_WITH_AI.md (Join-Path $packageRoot 'PLAY_WITH_AI.md')
          "package_name=$packageName" | Add-Content $env:GITHUB_OUTPUT
          "package_root=$packageRoot" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify Windows portable package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          @('PLAY_WITH_AI.md', 'BUILD_INFO.txt', 'runtime/identity.cmd', 'runtime/node/node.exe', 'run-npm.cmd', 'run-vite-node.cmd', 'run-session.cmd', 'game/package.json', 'game/package-lock.json', 'game/dist/portable/session-cli.mjs') |
            ForEach-Object { if (-not (Test-Path (Join-Path $root $_))) { throw "Missing portable package entry: $_" } }
          $version = (Get-Content -Raw -LiteralPath (Join-Path $root 'game/package.json') | ConvertFrom-Json).version
          if ($version -ne '1.5.2') { throw "Expected app version 1.5.2, received $version" }
          if (-not (Select-String -Quiet -Path (Join-Path $root 'BUILD_INFO.txt') -Pattern 'Platform: win-x64')) { throw 'BUILD_INFO platform is missing' }

      - name: Smoke test bundled Windows Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          $help = & "$root/run-session.cmd" --help | ConvertFrom-Json
          if ($help.ok -ne $true -or $help.playTurn.command -ne 'play-turn') { throw 'Windows run-session launcher did not expose play-turn' }
          & "$root/run-npm.cmd" run sim -- --agent=random --games=1 --seed=1 --summary-only --out="$env:RUNNER_TEMP/portable-ai-windows-smoke" --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete persistent Sessions with bundled Windows Node
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          & "$root/run-vite-node.cmd" "$root/game/src/testing/portable-session-e2e.ts" --cli="$root/game/dist/portable/session-cli.mjs" --root="$env:RUNNER_TEMP/portable-session-windows" --out="$root/PORTABLE_SESSION_E2E.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw "$root/PORTABLE_SESSION_E2E.json" | ConvertFrom-Json
          if (-not $report.ok -or -not $report.replayMatched -or $report.seeds.Count -ne 2) { throw 'Windows portable Session E2E report is incomplete' }

      - name: Create Windows distributable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.package_windows.outputs.package_root }}'
          $zip = Join-Path $env:GITHUB_WORKSPACE '${{ steps.package_windows.outputs.package_name }}.zip'
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload Windows portable AI package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_windows.outputs.package_name }}
          path: ${{ steps.package_windows.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
