name: v1.4.5 Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v145-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v144-baseline-seeds:
    name: v1.4.4 baseline ${{ matrix.agent }} seeds ${{ matrix.seed }}-${{ matrix.endSeed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 101
            endSeed: 200
          - agent: balanced
            seed: 201
            endSeed: 300
    steps:
      - name: Check out v1.4.4 stable implementation
        uses: actions/checkout@v4
        with:
          ref: 3192009f2dd34d2a0b5480618e0a7aed534e7d88

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked v1.4.4 dependencies
        run: npm ci

      - name: Run v1.4.4 baseline batch
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=${{ matrix.agent }} --games=100 --seed=${{ matrix.seed }} --summary-only --out=output/simulations/v144-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }} --overwrite

      - name: Upload v1.4.4 baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v144-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }}
          path: output/simulations/v144-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }}
          if-no-files-found: error
          retention-days: 30

  standard-seeds:
    name: ${{ matrix.agent }} standard seeds ${{ matrix.seed }}-${{ matrix.endSeed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 101
            endSeed: 200
          - agent: balanced
            seed: 201
            endSeed: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release batch
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=${{ matrix.agent }} --games=100 --seed=${{ matrix.seed }} --summary-only --out=output/simulations/v145-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }} --overwrite

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v145-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }}
          path: output/simulations/v145-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }}
          if-no-files-found: error
          retention-days: 30
