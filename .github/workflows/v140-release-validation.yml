name: v1.4.4 Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v144-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v143-baseline-seeds:
    name: v1.4.3 baseline ${{ matrix.agent }} seeds ${{ matrix.seed }}-${{ matrix.endSeed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 101
            endSeed: 200
          - agent: balanced
            seed: 201
            endSeed: 300
    steps:
      - name: Check out v1.4.3 stable implementation
        uses: actions/checkout@v4
        with:
          ref: ba3ebe5e17dacb83863033f01439c2c855aaee33

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked v1.4.3 dependencies
        run: npm ci

      - name: Run v1.4.3 baseline batch
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=${{ matrix.agent }} --games=100 --seed=${{ matrix.seed }} --summary-only --out=output/simulations/v143-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }} --overwrite

      - name: Upload v1.4.3 baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }}
          path: output/simulations/v143-${{ matrix.agent }}-baseline-${{ matrix.seed }}-${{ matrix.endSeed }}
          if-no-files-found: error
          retention-days: 30

  sensitivity:
    name: ${{ matrix.agent }} fuel-${{ matrix.fuel }} farm-${{ matrix.farmFood }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        agent: [random, balanced]
        fuel: [standard, half]
        farmFood: [5, 10]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run fixed-seed sensitivity batch
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          FUEL: ${{ matrix.fuel }}
          FARM_FOOD: ${{ matrix.farmFood }}
        run: |
          set -euo pipefail
          if [[ "${FUEL}" == "half" ]]; then
            POLICE_FUEL=6
            GUARD_FUEL=11
          else
            POLICE_FUEL=12
            GUARD_FUEL=22
          fi
          export POLICE_FUEL GUARD_FUEL
          CONFIG_JSON="$(node -e 'console.log(JSON.stringify({units:{police:{maxFuel:Number(process.env.POLICE_FUEL)},nationalGuard:{maxFuel:Number(process.env.GUARD_FUEL)}},facilities:{simpleFarm:{production:{outputs:{food:Number(process.env.FARM_FOOD)},powerMode:"none",powerCapacity:0,requiresPower:false}}}}))')"
          npx --no-install vite-node --script src/agent/sim-cli.ts \
            --agent="${AGENT}" \
            --games=100 \
            --seed=1 \
            --summary-only \
            --config-json="${CONFIG_JSON}" \
            --out="output/simulations/v144-${AGENT}-${FUEL}-farm${FARM_FOOD}" \
            --overwrite

      - name: Upload sensitivity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v144-${{ matrix.agent }}-${{ matrix.fuel }}-farm${{ matrix.farmFood }}
          path: output/simulations/v144-*
          if-no-files-found: error
          retention-days: 30

  standard-seeds:
    name: ${{ matrix.agent }} standard seeds ${{ matrix.seed }}-${{ matrix.endSeed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 101
            endSeed: 200
          - agent: balanced
            seed: 201
            endSeed: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release batch
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=${{ matrix.agent }} --games=100 --seed=${{ matrix.seed }} --summary-only --out=output/simulations/v144-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }} --overwrite

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v144-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }}
          path: output/simulations/v144-${{ matrix.agent }}-release-${{ matrix.seed }}-${{ matrix.endSeed }}
          if-no-files-found: error
          retention-days: 30
