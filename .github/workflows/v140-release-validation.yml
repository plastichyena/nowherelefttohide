name: v1.5.7 Release Validation

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional completed run whose 200 replays and large Session passed; runtime must be unchanged'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: v157-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-validation:
    if: inputs.reuse_run_id == ''
    name: v1.5.7 ${{ matrix.agent }} seeds ${{ matrix.start }} + 9
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        agent: [random, balanced]
        start: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91]
    steps:
      - name: Check out v1.5.7 candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run 10 fixed seeds with the unchanged 100-turn ceiling
        shell: bash
        run: |
          npx --no-install vite-node --script src/agent/sim-cli.ts \
            --agent=${{ matrix.agent }} --games=10 --seed=${{ matrix.start }} \
            --max-turns=100 --out=output/release-shard --overwrite

      - name: Verify every game completed and every replay matches
        if: ${{ !cancelled() }}
        run: npx --no-install vite-node --script src/testing/release-seed-validation.ts shard output/release-shard/run.json ${{ matrix.agent }} ${{ matrix.start }} 10

      # Upload compact diagnostics first, even if a simulation fails. The
      # aggregate job does not need to download gigabytes of replay histories.
      - name: Upload shard report and replay verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v157-report-${{ matrix.agent }}-${{ matrix.start }}
          path: |
            output/release-shard/run.json
            output/release-shard/games.csv
            output/release-shard/replay-validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload replay and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v157-replays-${{ matrix.agent }}-${{ matrix.start }}
          path: output/release-shard/games
          if-no-files-found: error
          retention-days: 30

  agent-coverage:
    name: Verify all 200 games and replays, record Final Horde coverage
    needs: agent-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: v157-report-*
          path: output/release-reports
      - run: npx --no-install vite-node --script src/testing/release-seed-validation.ts aggregate output/release-reports
      - uses: actions/upload-artifact@v4
        with:
          name: v157-release-summary
          path: output/release-reports/release-summary.json

  session-large-package-validation:
    if: inputs.reuse_run_id == ''
    name: Session v1.5.7 physical 512 MiB Package validation
    # This is a separate manual-release job. It verifies actual Core EndTurn
    # transitions and a physical Artifact Package without gating Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate a physical 512 MiB Artifact Package
        run: npx --no-install vite-node --script src/testing/session-release-validation.ts --decisions=1000 --large-mib=512 --json-out=output/session-release/large-512.json

      - name: Validate public ZIP viewer, seeks and cancellation
        run: npx --no-install vite-node --script src/testing/v155-replay-validation.ts output/session-release/large-512.json

      - name: Upload large Session validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-v157-large-512mib
          path: output/session-release/large-512*.json
          if-no-files-found: warn
          retention-days: 30

  verify-existing-executions:
    name: Verify unchanged runtime against successful recorded executions
    if: inputs.reuse_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify source jobs and unchanged runtime
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_run_id }}
        run: node scripts/verify-release-reuse.mjs source "$SOURCE_RUN"
      - name: Test evidence reuse guards
        run: node --test scripts/verify-release-reuse.test.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          pattern: v157-report-*
          path: output/release-reuse/reports
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          name: session-v157-large-512mib
          path: output/release-reuse/session
      - name: Verify artifact source and physical endurance evidence
        run: node scripts/verify-release-reuse.mjs artifacts
      - name: Recheck all seeds, replay evidence, and progression metrics
        run: npx --no-install vite-node --script src/testing/release-seed-validation.ts aggregate output/release-reuse/reports
      - uses: actions/upload-artifact@v4
        with:
          name: v157-release-summary
          path: |
            output/release-reuse/source.json
            output/release-reuse/reports/release-summary.json
