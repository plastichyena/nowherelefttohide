name: v1.5.2 Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v152-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-comparison:
    name: v1.5.1 baseline vs v1.5.2 ${{ matrix.agent }} seeds ${{ matrix.seed }}-${{ matrix.endSeed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
            seed: 1
            endSeed: 100
          - agent: balanced
            seed: 1
            endSeed: 100
    steps:
      - name: Check out v1.5.2 candidate
        uses: actions/checkout@v4

      # Full SHA prevents actions/checkout from treating the v1.5.1 baseline
      # as a branch ref, which caused run 33945010119 to fail before testing.
      - name: Check out immutable v1.5.1 baseline
        uses: actions/checkout@v4
        with:
          ref: e98f1f57f2c1747588d8840d32bf623bbd625dca
          path: baseline-v151

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked candidate dependencies
        run: npm ci

      - name: Install locked baseline dependencies
        run: npm ci
        working-directory: baseline-v151

      - name: Compare deterministic release batches with a 100-turn runner limit
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/output/simulations/v152-${{ matrix.agent }}-comparison-${{ matrix.seed }}-${{ matrix.endSeed }}"
          BASELINE_OUTPUT="$OUTPUT/baseline-v151"
          CANDIDATE_OUTPUT="$OUTPUT/candidate-v152"

          (
            cd "$GITHUB_WORKSPACE/baseline-v151"
            npx --no-install vite-node --script src/agent/sim-cli.ts \
              --agent=${{ matrix.agent }} \
              --games=100 \
              --seed=${{ matrix.seed }} \
              --max-turns=100 \
              --summary-only \
              --out="$BASELINE_OUTPUT" \
              --overwrite
          )
          npx --no-install vite-node --script src/agent/sim-cli.ts \
            --agent=${{ matrix.agent }} \
            --games=100 \
            --seed=${{ matrix.seed }} \
            --max-turns=100 \
            --summary-only \
            --out="$CANDIDATE_OUTPUT" \
            --overwrite
          node scripts/verify-release-baseline.mjs \
            --baseline="$BASELINE_OUTPUT/run.json" \
            --candidate="$CANDIDATE_OUTPUT/run.json" \
            --out="$OUTPUT/comparison.json"

      - name: Require a Balanced Final Horde run after turn 50
        if: matrix.agent == 'balanced'
        run: node scripts/verify-release-final-horde.mjs output/simulations/v152-${{ matrix.agent }}-comparison-${{ matrix.seed }}-${{ matrix.endSeed }}/candidate-v152/run.json

      - name: Upload baseline comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v152-${{ matrix.agent }}-comparison-${{ matrix.seed }}-${{ matrix.endSeed }}
          path: output/simulations/v152-${{ matrix.agent }}-comparison-${{ matrix.seed }}-${{ matrix.endSeed }}
          if-no-files-found: warn
          retention-days: 30

  session-large-package-validation:
    name: Session v1.5.2 physical 512 MiB Package validation
    # This is a separate manual-release job. It verifies actual Core EndTurn
    # transitions and a physical Artifact Package without gating Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate a physical 512 MiB Artifact Package
        run: npx --no-install vite-node --script src/testing/session-release-validation.ts --decisions=1000 --large-mib=512 --json-out=output/session-release/large-512.json

      - name: Upload large Session validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-v152-large-512mib
          path: output/session-release/large-512.json
          if-no-files-found: warn
          retention-days: 30
