name: v1.5.4 Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v154-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-validation:
    name: v1.5.4 ${{ matrix.agent }} fixed seeds 1-100
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: random
          - agent: balanced
    steps:
      - name: Check out v1.5.4 candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run fixed seeds 1-100 with technical and replay validation
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/output/simulations/v154-${{ matrix.agent }}-seeds-1-100"
          npx --no-install vite-node --script src/agent/sim-cli.ts \
            --agent=${{ matrix.agent }} \
            --games=100 \
            --seed=1 \
            --max-turns=100 \
            --out="$OUTPUT" \
            --overwrite

          cat > "$RUNNER_TEMP/verify-v154-replay.ts" <<'EOF'
          import { readFileSync, readdirSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { replayArtifact } from '${{ github.workspace }}/src/agent/runner';

          const reportPath = resolve(process.argv[2]!);
          const report = JSON.parse(readFileSync(reportPath, 'utf8')) as {
            appVersion?: string;
            execution?: { agents?: string[]; seeds?: number[]; limits?: { maxTurns?: number } };
            games?: Array<{ agentId?: string; seed?: number; outcome?: string }>;
            failures?: unknown[];
            technicalFailureCount?: number;
            limitReachedCount?: number;
          };
          const expectedSeeds = Array.from({ length: 100 }, (_, index) => index + 1);
          if (report.appVersion !== '1.5.4') throw new Error(`Unexpected app version: ${String(report.appVersion)}`);
          if (JSON.stringify(report.execution?.agents) !== JSON.stringify(['${{ matrix.agent }}'])) throw new Error('Agent strategy metadata is not fixed');
          if (JSON.stringify(report.execution?.seeds) !== JSON.stringify(expectedSeeds)) throw new Error('Release seeds are not exactly 1..100');
          if (report.execution?.limits?.maxTurns !== 100) throw new Error('Runner maxTurns must remain 100');
          if (report.games?.length !== 100 || report.failures?.length !== 0 || report.technicalFailureCount !== 0) throw new Error('Technical failure in fixed seed batch');
          if (report.limitReachedCount !== 0) throw new Error('A fixed seed batch reached the runner limit before Game Over');

          const output = dirname(reportPath);
          const artifactPaths = readdirSync(join(output, 'games'))
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => join(output, 'games', name));
          if (artifactPaths.length !== 100) throw new Error(`Expected 100 replay artifacts, received ${artifactPaths.length}`);
          for (const [index, artifactPath] of artifactPaths.entries()) {
            const artifact = JSON.parse(readFileSync(artifactPath, 'utf8')) as { artifactType?: string; agent?: { strategy?: string }; seed?: number };
            if (artifact.artifactType !== 'replay' || artifact.agent?.strategy !== '${{ matrix.agent }}' || artifact.seed !== expectedSeeds[index]) throw new Error(`Artifact metadata mismatch at ${artifactPath}`);
            const replay = replayArtifact(artifact as never);
            if (!replay.reproduced || replay.error !== null) throw new Error(`Replay mismatch at ${artifactPath}: ${replay.mismatch ?? 'unknown'}`);
          }
          process.stdout.write(JSON.stringify({ appVersion: report.appVersion, agent: '${{ matrix.agent }}', seeds: 100, replayed: artifactPaths.length }) + '\n');
          EOF
          npx --no-install vite-node --script "$RUNNER_TEMP/verify-v154-replay.ts" "$OUTPUT/run.json"

      - name: Require a Balanced Final Horde run after turn 50
        if: matrix.agent == 'balanced'
        run: node scripts/verify-release-final-horde.mjs output/simulations/v154-balanced-seeds-1-100/run.json

      - name: Upload v1.5.4 agent validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v154-${{ matrix.agent }}-validation-seeds-1-100
          path: output/simulations/v154-${{ matrix.agent }}-seeds-1-100
          if-no-files-found: warn
          retention-days: 30

  session-large-package-validation:
    name: Session v1.5.4 physical 512 MiB Package validation
    # This is a separate manual-release job. It verifies actual Core EndTurn
    # transitions and a physical Artifact Package without gating Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate a physical 512 MiB Artifact Package
        run: npx --no-install vite-node --script src/testing/session-release-validation.ts --decisions=1000 --large-mib=512 --json-out=output/session-release/large-512.json

      - name: Upload large Session validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-v154-large-512mib
          path: output/session-release/large-512.json
          if-no-files-found: warn
          retention-days: 30
