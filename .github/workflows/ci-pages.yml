name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, agents, bridge smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and invariant tests
        run: npm test

      # Keep this command explicit so a missing Random Agent smoke script fails
      # CI instead of silently skipping the required 100-game run.
      - name: Run 100 seeded Random Agent games
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=random --games=100 --seed=1 --summary-only --out=output/simulations/random-smoke --overwrite

      - name: Upload Random Agent failure artifact
        if: failure() && hashFiles('output/simulations/random-smoke/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: random-agent-failures-${{ github.run_id }}
          path: output/simulations/random-smoke
          if-no-files-found: ignore

      # Keep this command explicit so a missing Balanced Agent smoke script
      # fails CI instead of skipping the required fixed-seed 100-game run.
      - name: Run 100 seeded Balanced Agent games
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=balanced --games=100 --seed=1 --summary-only --out=output/simulations/balanced-smoke --overwrite

      - name: Upload Balanced Agent failure artifact
        if: failure() && hashFiles('output/simulations/balanced-smoke/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balanced-agent-failures-${{ github.run_id }}
          path: output/simulations/balanced-smoke
          if-no-files-found: ignore

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      # This smoke intentionally has no browser-driver dependency: it checks
      # the generated Pages artifact and its public bridge contract.
      - name: Smoke test Browser Bridge in production bundle
        run: npm run test:browser-bridge

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
