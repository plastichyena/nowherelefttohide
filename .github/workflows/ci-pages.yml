name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, bridge smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and invariant tests
        # The 30-seed regression file is covered by the stricter 1..100 matrix
        # below. Keeping it out of this job prevents slow seeds from timing out
        # while preserving the exact fixed-seed release gate.
        run: npx --no-install vitest run --exclude src/agent/balancedAgent.batch.test.ts

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      # This smoke intentionally has no browser-driver dependency: it checks
      # the generated Pages artifact and its public bridge contract.
      - name: Smoke test Browser Bridge in production bundle
        run: npm run test:browser-bridge

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  agent-seeds:
    name: ${{ matrix.agent }} seeds from ${{ matrix.seed }} (10 games)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        agent: [random, balanced]
        seed: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run 10 fixed-seed games
        run: npx --no-install vite-node --script src/agent/sim-cli.ts --agent=${{ matrix.agent }} --games=10 --seed=${{ matrix.seed }} --summary-only --out=output/simulations/${{ matrix.agent }}-${{ matrix.seed }} --overwrite

      - name: Upload failure artifact
        if: failure() && hashFiles('output/simulations/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.agent }}-agent-failures-${{ matrix.seed }}-${{ github.run_id }}
          path: output/simulations
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, agent-seeds]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
