name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, bridge smoke, and build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and invariant tests
        # The full 1..30 deterministic regression is split into the matrix job
        # below so this Pages gate stays responsive.
        run: npx --no-install vitest run --maxWorkers=2 --exclude src/agent/balancedAgent.batch.test.ts

      - name: Test v1.5.0 baseline report normalization
        run: node --test scripts/normalize-baseline-report.test.mjs

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Include license notices in Pages bundle
        run: |
          cp LICENSE dist/LICENSE
          cp ADDITIONAL_PERMISSIONS.md dist/ADDITIONAL_PERMISSIONS.md
          cp ASSETS_LICENSE.md dist/ASSETS_LICENSE.md
          cp THIRD_PARTY_NOTICES dist/THIRD_PARTY_NOTICES
          test -f dist/LICENSE
          test -f dist/ADDITIONAL_PERMISSIONS.md
          test -f dist/ASSETS_LICENSE.md
          test -f dist/THIRD_PARTY_NOTICES

      # This smoke intentionally has no browser-driver dependency: it checks
      # the generated Pages artifact and its public bridge contract.
      - name: Smoke test Browser Bridge in production bundle
        run: npm run test:browser-bridge

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  balanced-seed-regression:
    name: Balanced seeds ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 1
            end: 3
          - start: 4
            end: 6
          - start: 7
            end: 9
          - start: 10
            end: 12
          - start: 13
            end: 15
          - start: 16
            end: 18
          - start: 19
            end: 21
          - start: 22
            end: 24
          - start: 25
            end: 27
          - start: 28
            end: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run v1.5.1 Balanced seed regression
        env:
          AGENT_STRATEGY: balanced
          BALANCED_SEED_START: ${{ matrix.start }}
          BALANCED_SEED_END: ${{ matrix.end }}
          BALANCED_BATCH_TIMEOUT_MS: 1500000
        run: npx --no-install vitest run src/agent/balancedAgent.batch.test.ts --maxWorkers=1

  session-release-validation:
    name: Session v1.5.1 normal 1,000-action validation
    # This long-running job is independent of verify: Pages deployment must
    # not wait for release persistence validation.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate 1,000 accepted Core actions through SessionService
        run: npx --no-install vite-node --script src/testing/session-release-validation.ts --decisions=1000 --json-out=output/session-release/normal-1000.json

      - name: Upload Session validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-v151-normal-1000
          path: output/session-release/normal-1000.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Long fixed-seed release batches live in the separately dispatched
    # v1.5.1 Release Validation workflow and never delay Pages or AI Portable.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
